[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatch-smart-patches"
version = "1.0.0"
description = "Smart Patches Project: Hatch - A tool for applying Git patches using logical language"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "Danil Varakin", email = "zxcasdzxcasd670@gmail.com"},
    {name = "Kirillkadr"}
]
keywords = ["git", "patch", "code", "diff", "smart-patches"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "termcolor>=2.0.0,<3.0.0",
    "tree-sitter>=0.24.0,<1.0.0",
    "tree-sitter-python>=0.23.0,<1.0.0",
    "tree-sitter-javascript>=0.23.0,<1.0.0",
    "tree-sitter-typescript>=0.23.0,<1.0.0",
    "tree-sitter-rust>=0.23.0,<1.0.0",
    "tree-sitter-go>=0.23.0,<1.0.0",
    "tree-sitter-java>=0.23.0,<1.0.0",
    "tree-sitter-c>=0.23.0,<1.0.0",
    "tree-sitter-cpp>=0.23.0,<1.0.0",
    "tree-sitter-c-sharp>=0.23.0,<1.0.0",
    "tree-sitter-ruby>=0.23.0,<1.0.0",
    "tree-sitter-php>=0.23.0,<1.0.0",
    "tree-sitter-swift>=0.23.0,<1.0.0",
    "tree-sitter-kotlin>=0.23.0,<1.0.0",
    "tree-sitter-bash>=0.23.0,<1.0.0",
    "tree-sitter-html>=0.23.0,<1.0.0",
    "tree-sitter-css>=0.23.0,<1.0.0",
    "tree-sitter-json>=0.23.0,<1.0.0",
    "tree-sitter-toml>=0.23.0,<1.0.0",
    "tree-sitter-yaml>=0.23.0,<1.0.0",
    "tree-sitter-sql>=0.23.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "black>=22.0,<25.0",
    "flake8>=5.0,<8.0",
    "mypy>=1.0,<2.0",
    "isort>=5.0,<6.0",
    "ruff>=0.1.0,<1.0.0",
]
test = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "pytest-mock>=3.10.0,<4.0.0",
]
devOld = [
    "termcolor==3.1.0;python_version=='3.9'",
    "tree-sitter==0.23.2;python_version=='3.9'",
    "tree-sitter-language-pack==0.9.1;python_version=='3.9'",
]
all = [
    "hatch-smart-patches[dev,test]",
]

[project.urls]
Homepage = "https://github.com/Danil-Varakin/Hatch"
Repository = "https://github.com/Danil-Varakin/Hatch"
Issues = "https://github.com/Danil-Varakin/Hatch/issues"

[project.scripts]
hatch-patch = "Hatch:main"

[tool.setuptools]
py-modules = [
    "CompressionInput",
    "CompressionVersion",
    "Insert",
    "Logging",
    "MainCMD",
    "MainCompressionCMD",
    "MainOt",
    "MainOt2",
    "MainTest",
    "SearchCode",
    "TokenizeCode",
    "Utilities",
    "constants",
    "getChange",
    "gitUtils",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["CompressionConstants*"]
exclude = ["test*", "venv*", ".git*", "logs*", "*.egg-info"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true